<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunks đã lưu · 6 Minute English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#fbfaf5; --surface:#ffffff; --surface-soft:#ebf6ee; --surface-inverse:#17301d;
  --ink-900:#171c18; --ink-700:#1f2a22; --ink-500:#505e4f;
  --primary:#32854d; --primary-hover:#317345; --primary-text:#317345; --focus:#4a9b60;
  --border:#e1eae5; --border-strong:#84968a; --warning-soft:#fbf3e0; --warning-text:#8a6421;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-full:999px;
  --shadow-sm:0 1px 2px rgba(23,48,29,.06); --shadow-md:0 8px 24px rgba(23,48,29,.08);
  --font-sans:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:16px;line-height:24px;color:var(--ink-700);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--radius-sm)}
.hidden{display:none !important}
.wrap{max-width:860px;margin:0 auto;padding:0 24px 64px}

.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.brand{font-weight:700;color:var(--ink-900);text-decoration:none;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--primary-text)}

.hb-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--radius-md);font:600 15px/22px var(--font-sans);text-decoration:none;border:1.5px solid transparent;cursor:pointer;background:none;transition:background .15s}
.hb-btn:disabled{opacity:.45;cursor:not-allowed}
.hb-btn--primary{background:var(--primary);color:#fff}
.hb-btn--primary:hover:not(:disabled){background:var(--primary-hover)}
.hb-btn--secondary{border-color:var(--border-strong);color:var(--ink-900);background:transparent}
.hb-btn--secondary:hover:not(:disabled){background:var(--surface-soft)}
.hb-btn.sm{padding:8px 14px;font-size:14px}
.link{background:none;border:0;color:var(--ink-500);font:600 14px/20px var(--font-sans);cursor:pointer;text-decoration:underline;padding:4px}
.link.danger:hover{color:#c2412f}

.speak{background:none;border:1.5px solid var(--border-strong);border-radius:var(--radius-full);color:var(--primary-text);cursor:pointer;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;margin-right:10px;vertical-align:middle;flex-shrink:0}
.speak:hover{background:var(--surface-soft)}
.speak.big{width:44px;height:44px;font-size:18px}

.hb-eyebrow{font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--primary-text);margin-bottom:12px}
.hb-title{font:700 36px/42px var(--font-sans);letter-spacing:-.02em;color:var(--ink-900)}
.hb-title em{font-style:normal;color:var(--primary)}
.lead{font-size:16px;color:var(--ink-500);margin-top:8px}
.head{padding:32px 0 24px}
.summary{font-size:15px;color:var(--ink-700);margin-top:12px;font-weight:600}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:24px}
.tabs{display:flex;gap:24px}
.tab{background:none;border:0;padding:0 0 14px;font:600 15px/22px var(--font-sans);color:var(--ink-500);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--primary-text);border-bottom-color:var(--primary)}
.tab span{display:inline-block;min-width:22px;padding:0 6px;border-radius:var(--radius-full);background:var(--surface-soft);color:var(--primary-text);font-size:12px;line-height:20px;text-align:center}
.toolbar .hb-btn{margin-bottom:12px}
.next-note{font-size:14px;color:var(--ink-500);margin-bottom:12px}

.list{list-style:none;display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.item h3{font:600 20px/26px var(--font-sans);color:var(--ink-900)}
.ipa{font:400 13px/18px ui-monospace,Menlo,monospace;color:var(--ink-500);margin-left:8px}
.vi{font-size:15px;color:var(--ink-700);margin-top:6px}
.from{font-size:13px;color:var(--ink-500);margin-top:6px}
.status{font-size:13px;color:var(--primary-text);font-weight:600;margin-top:6px}
.item-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{background:var(--warning-soft);color:var(--ink-700);border-radius:var(--radius-md);padding:20px 24px;font-size:15px}

.review{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-md);margin-bottom:24px;text-align:center}
.review .small{font-size:13px;color:var(--ink-500)}
.review h2{font:700 34px/40px var(--font-sans);color:var(--ink-900);margin:12px 0 4px}
.review .en{font-size:15px;color:var(--ink-500);margin-top:12px}
.review .sample{font-style:italic;color:var(--ink-700);margin-top:12px}
.review .flip{margin-top:24px}
.review .actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.review .close{margin-top:16px}
.review .section-label{font:700 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--primary-text);margin-top:20px}

.daily-list{list-style:none;display:grid;gap:8px;margin-top:10px;text-align:left}
.daily-list li{background:var(--surface-soft);border-radius:var(--radius-md);padding:10px 14px}
.daily-list .d-en{font-style:italic;color:var(--ink-900);display:block}
.daily-list .d-vi{font-size:14px;color:var(--ink-500);display:block;margin-top:2px}

.fullcard-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-md);margin-bottom:24px}
.fc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fc-badge{display:inline-block;padding:4px 12px;border-radius:var(--radius-full);font:600 12px/16px var(--font-sans);background:var(--surface-soft);color:var(--primary-text)}
.fullcard-wrap h2{font:700 34px/40px var(--font-sans);color:var(--ink-900);margin-top:12px}
.fullcard-wrap .ipa{margin-left:0;display:block;margin-top:4px}
.fc-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.fc-sec h4{font:700 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--primary-text);margin-bottom:8px}
.fc-sec p,.fc-sec li{font-size:15px;line-height:24px;color:var(--ink-700)}
.fc-sec ul{padding-left:20px;display:grid;gap:4px}
.fc-sec .it{font-style:italic}
.fc-note{background:var(--warning-soft);color:var(--warning-text);border-radius:var(--radius-md);padding:10px 14px;font-size:14px;margin-top:16px}
.fc-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}

@media (max-width:640px){
  .hb-title{font-size:28px;line-height:34px}
  .review h2{font-size:26px}
  .item{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="index.html">6 Minute <span>English</span></a>
    <a class="hb-btn hb-btn--secondary sm" href="index.html">← Về thư viện</a>
  </nav>

  <header class="head">
    <p class="hb-eyebrow">Ôn tập</p>
    <h1 class="hb-title">Chunks <em>đã lưu</em></h1>
    <p class="lead">Những chunk bạn bấm "Lưu để ôn" trong các bài học. Lịch ôn: 1 – 3 – 7 ngày, lưu theo tài khoản Gmail của bạn.</p>
    <p class="summary" id="summary"></p>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="today">Hôm nay <span id="cnt-today">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="upcoming">Sắp tới <span id="cnt-upcoming">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="mastered">Đã thuộc <span id="cnt-mastered">0</span></button>
    </div>
    <div>
      <p class="next-note" id="nextNote"></p>
      <button class="hb-btn hb-btn--primary" id="startReview">Ôn hôm nay (0)</button>
    </div>
  </div>

  <section id="fullCard" class="fullcard-wrap hidden" aria-live="polite"></section>

  <section id="reviewPanel" class="review hidden" aria-live="polite">
    <p class="small" id="flashProgress"></p>
    <h2 id="flashPhrase"></h2>
    <p class="small">
      <button class="speak big" id="flashSpeak" type="button" aria-label="Nghe phát âm"><i class="fa-solid fa-volume-high"></i></button>
      <span id="flashIpa"></span>
    </p>
    <div id="flashBack" class="hidden">
      <p class="vi" id="flashVi"></p>
      <p class="en" id="flashEn"></p>
      <p class="sample" id="flashSample"></p>
      <p class="section-label">Ví dụ đời sống</p>
      <ol class="daily-list" id="flashDaily"></ol>
    </div>
    <div class="flip" id="flipWrap">
      <button class="hb-btn hb-btn--secondary" id="flipBtn">Lật để xem nghĩa</button>
    </div>
    <div class="actions hidden" id="flashActions">
      <button class="hb-btn hb-btn--secondary" id="missBtn">Chưa nhớ</button>
      <button class="hb-btn hb-btn--primary" id="knowBtn">Nhớ rồi</button>
    </div>
    <button class="link close" id="closeReview">Đóng ôn tập</button>
  </section>

  <ul id="list" class="list" role="list"></ul>
  <div id="empty" class="empty hidden"></div>
</div>

<script src="chunk-list.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let tab = "today";
let queue = [];
let qi = 0;

const fmtDate = (iso) => {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function items() {
  return Object.values(ChunkList.load()).sort((a, b) =>
    (a.due || "").localeCompare(b.due || "") || a.savedAt - b.savedAt);
}

function patch(id, fn) {
  const data = ChunkList.load();
  if (!data[id]) return;
  fn(data[id]);
  ChunkList.save(data);
}

function removeItem(id) {
  const data = ChunkList.load();
  delete data[id];
  ChunkList.save(data);
}

// Phát âm bằng giọng Anh-Anh của trình duyệt
function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function statusText(x, t) {
  if (x.status === "mastered") return "Đã thuộc";
  const mocThu = `Mốc ${x.stage + 1}/3`;
  if (x.due <= t) return `Hôm nay · ${mocThu}`;
  return `Còn ${ChunkList.daysBetween(t, x.due)} ngày · ${mocThu}`;
}

function card(x, t) {
  const link = encodeURI(x.file) + "?phrase=" + encodeURIComponent(x.phraseId);
  return `<li class="item">
    <div>
      <h3><button class="speak" type="button" data-speak="${esc(x.phrase)}" aria-label="Nghe ${esc(x.phrase)}"><i class="fa-solid fa-volume-high"></i></button>${esc(x.phrase)}<span class="ipa">${esc(x.ipa)}</span></h3>
      <p class="vi">${esc(x.vi)}</p>
      <p class="from">Từ bài: ${esc(x.lesson)}</p>
      <p class="status">${esc(statusText(x, t))}</p>
    </div>
    <div class="item-actions">
      <a class="hb-btn hb-btn--secondary sm" href="${link}">Xem trong bài</a>
      <button class="hb-btn hb-btn--secondary sm" data-flash="${esc(x.id)}">Xem flashcard</button>
      ${x.status === "mastered" ? `<button class="hb-btn hb-btn--secondary sm" data-restart="${esc(x.id)}">Ôn lại</button>` : ""}
      <button class="link danger" data-del="${esc(x.id)}">Xóa</button>
    </div>
  </li>`;
}

function render() {
  const t = ChunkList.today();
  const all = items();
  const mastered = all.filter(x => x.status === "mastered");
  const due = all.filter(x => x.status !== "mastered" && x.due <= t);
  const upcoming = all.filter(x => x.status !== "mastered" && x.due > t);

  $("cnt-today").textContent = due.length;
  $("cnt-upcoming").textContent = upcoming.length;
  $("cnt-mastered").textContent = mastered.length;
  $("summary").textContent = `Hôm nay cần ôn: ${due.length} · Sắp tới: ${upcoming.length} · Đã thuộc: ${mastered.length}`;

  $("startReview").textContent = `Ôn hôm nay (${due.length})`;
  $("startReview").disabled = due.length === 0;

  const nextDay = upcoming.length ? upcoming[0].due : "";
  $("nextNote").textContent = due.length === 0 && nextDay
    ? `Hôm nay bạn đã ôn xong ✓. Lần ôn tiếp theo: ${fmtDate(nextDay)}`
    : "";

  const lists = { today: due, upcoming, mastered };
  const list = lists[tab];
  $("list").innerHTML = list.map(x => card(x, t)).join("");

  const empty = $("empty");
  empty.classList.toggle("hidden", list.length > 0);
  empty.textContent = {
    today: "Hôm nay không có chunk nào đến hạn. Bạn có thể xem mục Sắp tới.",
    upcoming: "Chưa có chunk nào đang chờ ôn. Vào một bài học, chọn cụm từ và bấm \"Lưu để ôn\".",
    mastered: "Chưa có chunk nào ở mục Đã thuộc."
  }[tab];
}

// Ôn hôm nay: lật thẻ như flashcard
function startReview() {
  const t = ChunkList.today();
  queue = items().filter(x => x.status !== "mastered" && x.due <= t).map(x => x.id);
  if (queue.length === 0) return;
  qi = 0;
  $("reviewPanel").classList.remove("hidden");
  $("reviewPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  showCard();
}

function dailyHtml(list) {
  return (list || []).map(d => `<li><span class="d-en">${esc(d.en)}</span><span class="d-vi">${esc(d.vi)}</span></li>`).join("");
}

function showCard() {
  const current = items().find(x => x.id === queue[qi]);
  if (!current) return finish();
  $("flashProgress").textContent = `${qi + 1} / ${queue.length}`;
  $("flashPhrase").textContent = current.phrase;
  $("flashIpa").textContent = current.ipa || "";
  $("flashSpeak").dataset.speak = current.phrase;
  $("flashVi").textContent = current.vi || "";
  $("flashEn").textContent = current.en || "";
  $("flashSample").textContent = current.sample ? `"${current.sample}"` : "";
  $("flashDaily").innerHTML = dailyHtml(current.daily);
  $("flashBack").classList.add("hidden");
  $("flipWrap").classList.remove("hidden");
  $("flashActions").classList.add("hidden");
}

function finish() {
  $("flashProgress").textContent = "";
  $("flashPhrase").textContent = "Bạn đã ôn xong hôm nay ✓";
  $("flashIpa").textContent = "";
  $("flashBack").classList.add("hidden");
  $("flipWrap").classList.add("hidden");
  $("flashActions").classList.add("hidden");
  render();
}

function fullCardHtml(x) {
  const note = !x.structures
    ? `<p class="fc-note">Thẻ này được lưu trước khi có đầy đủ thông tin. Mở lại bài "${esc(x.lesson)}" một lần để cập nhật.</p>`
    : "";
  const list = (arr) => (arr || []).map(t => `<li>${esc(t)}</li>`).join("");
  return `
    <div class="fc-head">
      <span class="fc-badge">${esc(x.type || "")}${x.level ? " · " + esc(x.level) : ""}</span>
    </div>
    <h2><button class="speak big" type="button" data-speak="${esc(x.phrase)}" aria-label="Nghe phát âm"><i class="fa-solid fa-volume-high"></i></button>${esc(x.phrase)}</h2>
    <p class="ipa">${esc(x.ipa || "")}</p>
    ${note}
    <div class="fc-sec"><h4>Ý nghĩa tiếng Việt</h4><p>${esc(x.vi || "")}</p></div>
    <div class="fc-sec"><h4>English BBC definition</h4><p>${esc(x.en || "")}</p></div>
    ${x.structures && x.structures.length ? `<div class="fc-sec"><h4>Cấu trúc câu & cụm đi kèm</h4><ul>${list(x.structures)}</ul></div>` : ""}
    ${x.pronunciation ? `<div class="fc-sec"><h4>Phát âm</h4><p>${esc(x.pronunciation)}</p></div>` : ""}
    ${x.daily && x.daily.length ? `<div class="fc-sec"><h4>Ví dụ đời sống</h4><ol class="daily-list">${dailyHtml(x.daily)}</ol></div>` : ""}
    <div class="fc-sec">
      <h4>Ứng dụng trong Speaking (IELTS & Daily)</h4>
      ${x.sample ? `<p><strong>Speaking sample:</strong> <span class="it">"${esc(x.sample)}"</span></p>` : ""}
      ${x.speakingTip ? `<p style="margin-top:8px"><strong>Speaking tip:</strong> ${esc(x.speakingTip)}</p>` : ""}
    </div>
    <div class="fc-actions">
      <a class="hb-btn hb-btn--secondary sm" href="${encodeURI(x.file)}?phrase=${encodeURIComponent(x.phraseId)}">Xem trong bài</a>
      <button class="link" data-close-full>Đóng thẻ</button>
    </div>`;
}

function openFlash(id) {
  const x = items().find(i => i.id === id);
  if (!x) return;
  const box = $("fullCard");
  box.innerHTML = fullCardHtml(x);
  box.classList.remove("hidden");
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

// Một chỗ xử lý icon loa cho mọi nơi trên trang
document.addEventListener("click", (e) => {
  const sp = e.target.closest("[data-speak]");
  if (sp) speak(sp.dataset.speak);
});

$("fullCard").addEventListener("click", (e) => {
  if (e.target.closest("[data-close-full]")) $("fullCard").classList.add("hidden");
});

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    tab = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => {
      const on = b === btn;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    render();
  });
});

$("list").addEventListener("click", (e) => {
  const flash = e.target.closest("[data-flash]");
  const restart = e.target.closest("[data-restart]");
  const del = e.target.closest("[data-del]");
  if (flash) openFlash(flash.dataset.flash);
  if (restart) {
    patch(restart.dataset.restart, (x) => ChunkList.restart(x));
    render();
  }
  if (del) {
    if (!confirm("Xóa chunk này khỏi danh sách?")) return;
    removeItem(del.dataset.del);
    render();
  }
});

$("startReview").addEventListener("click", startReview);
$("closeReview").addEventListener("click", () => {
  $("reviewPanel").classList.add("hidden");
  render();
});

$("flipBtn").addEventListener("click", () => {
  $("flashBack").classList.remove("hidden");
  $("flipWrap").classList.add("hidden");
  $("flashActions").classList.remove("hidden");
});

$("missBtn").addEventListener("click", () => {
  patch(queue[qi], (x) => ChunkList.markMissed(x));
  qi = (qi + 1) % queue.length;
  showCard();
});

$("knowBtn").addEventListener("click", () => {
  patch(queue[qi], (x) => ChunkList.markKnown(x));
  queue.splice(qi, 1);
  if (queue.length === 0) return finish();
  qi = qi % queue.length;
  showCard();
});

// Khi đồng bộ với tài khoản xong, vẽ lại danh sách theo dữ liệu mới nhất
window.addEventListener("chunklist:synced", () => render());

render();
</script>
</body>
</html>
